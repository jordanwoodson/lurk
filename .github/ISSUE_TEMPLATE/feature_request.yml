name: ⭐ Feature request
description: A new patch, an option on an existing one, or support for another app.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing requests](https://github.com/jordanwoodson/lurk-morphe-patches/issues?q=is%3Aissue+label%3Aenhancement) first.
        Patches run on the phone only: features that need a server, another service's account, or a change on
        Twitch's, Kick's or Rumble's side can't be done here.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Twitch
        - Kick
        - Rumble
        - A new app
        - Lurk settings screen or workspace
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What it should do
      description: The behavior you want, and where in the app it lives (screen, button, setting). Screenshots help.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why
      description: The problem it solves or what it protects. Privacy, ads, upsells and watching comfort are the project's focus.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, prior art, how another client does it. For a new app, its package name and where it is downloadable from (APKMirror, Google Play or Uptodown).
